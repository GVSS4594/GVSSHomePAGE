name: Deploy to Live

on:
  push:
    branches:
      - main

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Authenticate clasp
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push to Apps Script
        run: clasp push -f

      - name: Update Live Production Deployment
        env:
          LIVE_DEPLOYMENT_ID: ${{ secrets.LIVE_DEPLOYMENT_ID }}
        if: env.LIVE_DEPLOYMENT_ID != ''
        run: clasp deploy -i $LIVE_DEPLOYMENT_ID -d "Auto-deployed Live Production"
